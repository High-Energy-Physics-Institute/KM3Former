[project]
name = "km3former"
version = "0.1.0"
description = "KM3Former is an open-source package developed under the High Energy Physics Institute, Tbilisi, Georgia, as part of the KM3NeT (Cubic Kilometre Neutrino Telescope) project. This repository contains a novel approach to muon reconstruction in neutrino telescopes using transformer-based deep learning models."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "davitjnz", email = "djanezashvili@gmail.com" },
]
dependencies = [
    "awkward>=2.6.6,<3",
    "click>=8.1.7,<9",
    "h5py>=3.16.0",
    "joblib>=1.4.2,<2",
    "km3io>=1.2.0,<2",
    "pandas>=2.2.2,<3",
    "scikit-learn>=1.5.1,<2",
    "tensorboard>=2.17.1,<3",
    "torch>=2.4.0,<3",
    "tqdm>=4.66.4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2,<9",
]

[tool.uv]
package = false
